name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache-dependency-path: xkeen-control/go.sum }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12' }
      - name: Go tests and vet
        working-directory: xkeen-control
        run: go test -race ./... && go vet ./...
      - name: Go vulnerability scan
        working-directory: xkeen-control
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Packaging tests
        working-directory: xkeen-control/packaging
        run: sh ./install_test.sh && sh ./install-companion_test.sh
      - name: Android tests and lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:verifyFileProviderPolicy :app:verifyLocaleResources :app:verifyUiResources --console=plain
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
