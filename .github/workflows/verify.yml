name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            xkeen-control/go.sum
            collector/go.sum
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6.3.0
      - name: Companion tests and vet
        working-directory: xkeen-control
        run: go test -race ./... && go vet ./...
      - name: Companion vulnerability scan
        working-directory: xkeen-control
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Collector tests and vet
        working-directory: collector
        run: go test -race ./... && go vet ./...
      - name: Collector vulnerability scan
        working-directory: collector
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Packaging tests
        working-directory: xkeen-control/packaging
        run: sh ./install-companion_test.sh
      - name: Secure-only runtime policy
        shell: pwsh
        run: ./scripts/verify-current-runtime.ps1
      - name: APK certificate parser tests
        shell: pwsh
        run: ./scripts/verify-signing-parser_test.ps1
      - name: Android tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:verifyFileProviderPolicy :app:verifyLocaleResources :app:verifyUiResources :app:assembleDebug --console=plain --no-daemon
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
